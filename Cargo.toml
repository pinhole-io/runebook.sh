[workspace]
resolver = "2"
members = ["crates/runebook", "crates/runebook-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BSD-4-Clause"
rust-version = "1.96"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.9"
