[package]
name = "runebook-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Runebook desktop window"

[[bin]]
name = "runebook"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
futures = "0.3"
cpal = "0.15"
gpui-kit = { version = "0.8.1", features = ["tree-sitter-languages", "gpui-fast"] }
latex-rust = "2.1.1"
image = { version = "0.25", default-features = false, features = ["png"] }
jiff = "0.2"
reqwest = { version = "0.12", features = ["blocking", "json"] }
runebook = { path = "../runebook" }
runebook-agent = { path = "../runebook-agent" }
runebook-capture = { path = "../runebook-capture" }
runebook-preview = { path = "../runebook-preview" }
runebook-research = { path = "../runebook-research" }
serde_json = "1"
superglue = { path = "../../../superglue", default-features = false }
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync", "time"] }
