[package]
name = "runebook-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Runebook desktop window"

[[bin]]
name = "runebook"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
charlotte = { path = "../../../charlotte", default-features = false, features = ["notepad"] }
cpal = "0.15"
gpui-kit = { version = "0.8", features = ["tree-sitter-markdown"] }
hound = "3.5"
reqwest = { version = "0.12", features = ["blocking", "json", "multipart"] }
runebook = { path = "../runebook" }
serde_json = "1"
superglue = { path = "../../../superglue", default-features = false }
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31.15"
wayland-protocols-wlr = { version = "0.3.12", default-features = false, features = ["client"] }
