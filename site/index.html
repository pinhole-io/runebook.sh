<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Runebook</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <p class="mark">Runebook</p>
    <h1>A local markdown note app.</h1>
    <p>The published binary is Linux x86_64. Install it with this command.</p>
    <pre><code>curl -fsSL https://runebook.sh | sh</code></pre>
    <p>The command installs <code>runebook</code> in <code>~/.local/bin</code>.</p>
    <p>Remove the app with this command. The vault stays on disk.</p>
    <pre><code>curl -fsSL https://runebook.sh/uninstall | sh</code></pre>
  </main>
</body>
</html>
